site_name: elm327
site_description: Connect to, configure and communicate with ELM327 OBD-II/CAN adapters.
strict: true

theme:
  name: mkdocs
  color_mode: auto # follow the OS light/dark preference
  user_color_mode_toggle: true
  navigation_depth: 3

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
